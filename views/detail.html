<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de la película</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <main class="container py-4">
        <a href="/" class="d-inline-block mb-3">← Volver al buscador</a>
        <p id="message" class="text-danger"></p> <!-- Mensaje de error que se muestra si la película no existe. -->

        <!-- Oculto hasta que detail.js tenga los datos, para no mostrar etiquetas vacías. -->
        <div id="movie" class="row g-4" hidden> 
            <div class="col-md-4">
                <img id="poster" class="img-fluid rounded" hidden>
            </div>
            <div class="col-md-8">
                <h1 id="title" class="mb-3"></h1>
                <p id="plot"></p>
                <p><strong>Director:</strong> <span id="director"></span></p>
                <p><strong>Reparto:</strong> <span id="actors"></span></p>
                <p><strong>Género:</strong> <span id="genre"></span></p>
                <p><strong>Duración:</strong> <span id="runtime"></span></p>
            </div>

            <!-- Dentro de #movie para que, si la película no existe, tampoco se vean sus comentarios. -->
            <section class="col-12">
                <h2 class="h4">Comentarios</h2>
                <!-- detail.js lee estos campos por su id al enviar el formulario. -->
                <!-- maxlength copia MAX_PERSON_LENGTH y MAX_COMMENT_LENGTH de controller.py: es una comodidad;
                     el límite que cuenta es el del servidor. Si cambian allí, hay que cambiarlos aquí. -->
                <form id="comment-form" class="mb-3">
                    <input id="person" class="form-control mb-2" placeholder="Tu nombre" maxlength="50" required>
                    <textarea id="comment" class="form-control mb-2" rows="3" placeholder="Tu comentario" maxlength="500" required></textarea>
                    <button class="btn btn-primary">Enviar comentario</button>
                </form>
                <p id="comment-error" class="text-danger"></p>
                <p id="comments-message" class="text-secondary"></p>
                <ul id="comments" class="list-group"></ul>
            </section>
        </div>
    </main>

    <script src="detail.js"></script>
</body>
</html>
