<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de películas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <main class="container py-4">
        <h1 class="mb-4">Buscador de películas</h1>

        <!-- Los id de este formulario son los que usará search.js para leer lo escrito. -->
        <form id="search-form" class="row g-2 mb-4">
            <div class="col-md-6">
                <input id="title" class="form-control" placeholder="Título (obligatorio)" required>
            </div>
            <div class="col-md-3">
                <input id="year" type="number" class="form-control" placeholder="Año (opcional)">
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100">Buscar</button>
            </div>
        </form>

        <!-- search.js escribirá aquí los errores y pintará aquí los resultados. -->
        <p id="message" class="text-danger"></p>
        <div id="results" class="list-group"></div>
    </main>

    <!-- Al final del body, para que cuando se ejecute el script ya existan los elementos de arriba. -->
    <script src="search.js"></script>
</body>
</html>
